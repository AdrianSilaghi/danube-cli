name: CI

# Build and test only. Publishing stays on GitHub Actions.
#
# `.forgejo/workflows` completely shadows `.github/workflows` on this forge --
# it is first-match-wins across .gitea -> .forgejo -> .github, not a merge. So
# adding this file means Forgejo no longer runs .github/workflows/ci.yml at
# all. That is deliberate: this repo is push-mirrored to github.com, where
# .github/workflows/ci.yml still fires on `v*` tags and publishes to npm with
# NPM_TOKEN. Do not add a publish job here -- it would double-publish, and
# `secrets.GITHUB_TOKEN` on Forgejo is scoped to this forge, not github.com.
#
# This also restores a gate that was lost: the push/pull_request test job was
# retired from .github/workflows/ci.yml when CI moved to Jenkins, and Jenkins
# has since been deleted, leaving the repo with no per-change CI at all.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # ubuntu-latest is the docker-executor runner (ifasconsult-docker). The two
    # host-mode runners are reserved for danubedata's own build and deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Deliberately no `cache: npm`. On GitHub's hosted runners that cache is
      # nearly free; here it is a local tar --use-compress-program zstdmt over
      # the npm cache, and it dominated the job: the first run took 566s, of
      # which ~274s was setup-node (cache restore + Node download) and ~263s
      # was the post-step cache save -- to speed up an `npm ci` that takes 6
      # seconds. pulumi-danubedata's equivalent job, with no cache, runs in 84s.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: npm test
